<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d19"><title>ECHO · Outplay yourself</title>
<style>
:root{color-scheme:dark;--bg:#080d19;--panel:#101827;--line:#253148;--you:#6bfbd1;--echo:#c092ff;--text:#edf5fc;--muted:#91a0b8;--glow:#6bfbd122}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 30% 0%,#172436 0,transparent 55%),var(--bg);color:var(--text);font:15px system-ui,sans-serif;min-height:100dvh}button,select,textarea{font:inherit;color:inherit}button,select{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;cursor:pointer;touch-action:manipulation}button:hover{border-color:var(--you)}button:focus-visible,select:focus-visible{outline:2px solid var(--you);outline-offset:3px}button:disabled{opacity:.4;cursor:default}main{max-width:990px;margin:auto;padding:24px 20px calc(22px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{font-size:32px;letter-spacing:9px;font-weight:850}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}.tools{display:flex;gap:8px}.tools button{padding:10px}.layout{display:grid;grid-template-columns:minmax(280px,1.2fr) minmax(260px,.8fr);gap:30px}.status{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.score{font-size:32px;font-weight:750;color:var(--you)}.score.enemy{color:var(--echo)}.versus{color:var(--muted);font-size:12px;letter-spacing:2px}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:10px;background:#070c16;border:1px solid var(--line);border-radius:20px;position:relative}.cell{aspect-ratio:1;position:relative;padding:0;border-radius:10px;background:#141e2d;overflow:hidden;min-width:0}.cell.mine{color:var(--you);background:var(--glow);border-color:#6bfbd155}.cell.enemy{color:var(--echo);background:#c092ff18;border-color:#c092ff55}.glyph{font-size:clamp(24px,5vw,38px);display:inline-block;line-height:1}.coord{position:absolute;top:5px;left:6px;font-size:9px;color:var(--muted);opacity:.6}.ghost{position:absolute;bottom:4px;right:4px;font-size:10px;color:var(--echo);opacity:.65}.ghost.next{opacity:1;background:#35264c;padding:2px 4px;border-radius:4px}.age{position:absolute;bottom:5px;left:6px;font-size:10px}.cell.pop .glyph{animation:pop .35s ease-out}.cell.suggest{box-shadow:inset 0 0 0 2px var(--you)}.board.shake{animation:shake .25s}.hint{min-height:48px;margin:14px 2px 6px;color:var(--muted);font-size:13px;line-height:1.5}.hint strong{color:var(--you)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}.units{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.unit{padding:12px 3px;font-size:11px}.unit .glyph{display:block;font-size:26px;margin-bottom:7px}.unit.active{border-color:var(--you);background:var(--glow);color:var(--you)}.unit-info{min-height:43px;color:var(--muted);font-size:12px;line-height:1.5;margin:10px 0 18px}.plan{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:20px}.step{border:1px solid var(--line);border-radius:9px;text-align:center;padding:8px 0;font-size:10px;color:var(--muted)}.step b{display:block;color:var(--echo);font-size:20px;margin:5px 0}.step.current{border-color:var(--echo);background:#c092ff12}.step.past{opacity:.4}.panel{background:#101827aa;border:1px solid var(--line);padding:16px;border-radius:16px;margin-top:16px}.stats{display:flex;justify-content:space-between;gap:8px}.stats b{display:block;font-size:23px;margin-top:4px}.progress{height:5px;background:#263047;border-radius:5px;overflow:hidden;margin-top:12px}.progress span{display:block;height:100%;background:var(--you);transition:width .4s}.row{display:flex;gap:8px;align-items:center;margin-top:12px}.row>*{flex:1;min-width:0}.primary{background:var(--you);color:#081913;border-color:var(--you);font-weight:750;width:100%}.tiny{font-size:11px;color:var(--muted);line-height:1.6}.log{min-height:40px;font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6}select{width:100%;font-size:12px}dialog{color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:24px;width:min(440px,92vw);max-height:90dvh}dialog::backdrop{background:#020611c9;backdrop-filter:blur(7px)}dialog h2{font-size:28px;margin:10px 0}dialog p{color:var(--muted);line-height:1.6}dialog .close{float:right;padding:6px 12px}textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;resize:vertical;font-family:monospace}footer{margin-top:24px;text-align:center;font-size:10px;letter-spacing:2px;color:var(--muted)}.spark{position:fixed;pointer-events:none;width:5px;height:5px;border-radius:50%;background:var(--you);z-index:5;animation:spark .55s ease-out forwards}@keyframes pop{from{transform:scale(.4) rotate(-20deg);opacity:.2}to{transform:scale(1);opacity:1}}@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}@keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}@media(max-width:690px){main{max-width:480px;padding:16px 14px}.layout{grid-template-columns:1fr;gap:10px}header{margin-bottom:18px}.brand{font-size:28px}.panel{margin-top:12px}.unit-info{margin-bottom:12px;min-height:32px}.plan{margin-bottom:12px}.board{gap:6px}.hint{min-height:38px;margin-top:10px}footer{margin-top:16px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main>
<header><div><div class="brand">ECHO<span style="color:var(--you)">.</span></div><div class="eyebrow">Your past is your opponent</div></div><div class="tools"><button id="sound" aria-label="Toggle sound">♪ Off</button><button id="help" aria-label="How to play">?</button></div></header>
<div class="layout"><section><div class="status"><div><span class="eyebrow">You</span><div class="score" id="youScore">0</div></div><div class="versus" id="turnLabel">TURN 01 / 08</div><div style="text-align:right"><span class="eyebrow">Your echo</span><div class="score enemy" id="echoScore">0</div></div></div><div class="board" id="board" aria-label="5 by 5 game board"></div><div class="hint" id="hint" aria-live="polite"></div><div class="section-title"><span>Echo timeline · all moves revealed</span></div><div class="plan" id="plan"></div><div class="tiny" id="modeNote"></div></section>
<aside><div class="section-title"><span>Choose your next move</span><span id="roundLabel">ROUND 1</span></div><div class="units" id="units"></div><div class="unit-info" id="unitInfo"></div><div class="row"><select id="mode" aria-label="Game mode"><option value="classic">Classic · previous round</option><option value="apex">Apex · best-scoring run</option><option value="daily">Daily Echo · UTC</option><option value="friend" disabled>Friend's Echo</option></select></div><div class="panel"><div class="stats"><div><span class="eyebrow">Streak</span><b id="streak">0</b></div><div><span class="eyebrow">Personal best</span><b id="best">0</b></div><div><span class="eyebrow">XP multiplier</span><b id="multi">×1</b></div></div><div class="progress"><span id="xpBar"></span></div><div class="tiny" id="xpText" style="margin-top:8px"></div></div><div class="row"><button id="share">Share Echo ↗</button><button id="import">Fight a code</button></div><div class="row"><button id="style">Skins & themes</button><button id="restart">Restart round</button></div><div class="log" id="log" aria-live="polite"></div><div class="tiny" id="saveNote">Saved on this device · No connection needed</div></aside></div><footer>THINK AHEAD. LEAVE A DANGEROUS PAST.</footer></main>
<dialog id="modal"><button class="close" id="close" aria-label="Close dialog">×</button><div id="modalContent"></div></dialog>
<script>
'use strict';
// 1. RULES ENGINE — deterministic, DOM-free. A turn = Echo move then player move.
const TYPES=['blade','wall','seed','mirror'];
const mirror=i=>Math.floor(i/5)*5+4-i%5; // Reflection across the vertical centre line.
const adjacent=i=>[i-5,i+5,...(i%5?[i-1]:[]),...(i%5<4?[i+1]:[])].filter(j=>j>=0&&j<25);
const distance=(a,b)=>Math.abs(a%5-b%5)+Math.abs(Math.floor(a/5)-Math.floor(b/5));
const clone=o=>JSON.parse(JSON.stringify(o));
const Rules={
 capture(board,i,owner,events){for(const j of adjacent(i)){const u=board[j];if(u&&u.owner!==owner&&u.type!=='wall'){u.owner=owner;events.push(j);}}},
 place(board,move,owner,turn){const events=[];if(board[move.p])return {blocked:true,events};board[move.p]={type:move.t,owner,born:turn};
 if(move.t==='blade')this.capture(board,move.p,owner,events);
 if(move.t==='mirror'){const candidates=board.map((u,i)=>({u,i})).filter(({u,i})=>u&&u.owner!==owner&&u.type!=='wall'&&mirror(i)!==i&&!board[mirror(i)]).sort((a,b)=>distance(a.i,move.p)-distance(b.i,move.p)||a.i-b.i);if(candidates.length){const i=candidates[0].i,j=mirror(i);board[j]=board[i];board[i]=null;events.push(i,j);}}
 return {blocked:false,events};},
 mature(board,turn){const ready=board.map((u,i)=>u&&u.type==='seed'&&turn-u.born>=2?{i,owner:u.owner}:null).filter(Boolean);const hits=new Map();for(const {i,owner} of ready){board[i].type='blade';for(const j of adjacent(i)){if(board[j]&&board[j].type!=='wall'&&board[j].owner!==owner){if(!hits.has(j))hits.set(j,new Set());hits.get(j).add(owner);}}}const events=ready.map(x=>x.i);for(const [i,owners] of hits){if(owners.size===1){board[i].owner=[...owners][0];events.push(i);}}return events;},
 score(board){return board.reduce((s,u)=>{if(u)s[u.owner]++;return s;},[0,0]);}
};
// GAME STATE — versioned local persistence, including an unfinished round.
const KEY='echo.game.v1';const defaults={xp:0,best:0,streaks:{classic:0,apex:0,daily:0,friend:0},rounds:0,tutorial:false,theme:'neon',skin:0,sound:false,last:null,champion:null,championScore:-1,daily:{}};
let profile=clone(defaults),game,selected='blade',audioCtx;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.version===1&&saved.profile){profile={...defaults,...saved.profile};game=saved.game;}}catch(e){}
const $=id=>document.getElementById(id);let storageOK=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify({version:1,profile,game}));}catch(e){storageOK=false;$('saveNote').textContent='Storage unavailable · progress lasts for this session only';}}
const coord=i=>'ABCDE'[i%5]+(Math.floor(i/5)+1);
const icons=[['⚔','▣','✦','◇'],['✕','⬡','✿','◈']];const icon=t=>icons[profile.skin?1:0][TYPES.indexOf(t)];
// 2. RENDERING — semantic buttons support touch, mouse and keyboard.
function render(changed=[]){const score=Rules.score(game.board);$('youScore').textContent=score[0];$('echoScore').textContent=score[1];$('turnLabel').textContent=game.over?'ROUND COMPLETE':`TURN ${String(game.turn+1).padStart(2,'0')} / 08`;$('roundLabel').textContent='ROUND '+game.round;
 $('board').innerHTML='';for(let i=0;i<25;i++){const u=game.board[i],b=document.createElement('button');b.className='cell'+(u?(u.owner===0?' mine':' enemy'):'')+(changed.includes(i)?' pop':'');b.disabled=!!u||game.over;b.setAttribute('aria-label',`${coord(i)}, ${u?(u.owner===0?'your ':'Echo ')+u.type:'empty; place '+selected}`);let ghosts=[];for(let t=game.turn+1;t<8;t++)if(game.echo[t].p===i)ghosts.push(t+1);b.innerHTML=`<span class="coord">${coord(i)}</span>${u?`<span class="glyph">${icon(u.type)}</span>`:''}${ghosts.length?`<span class="ghost ${ghosts[0]===game.turn+2?'next':''}">${ghosts.join('·')} ${icon(game.echo[ghosts[0]-1].t)}</span>`:''}${u&&u.type==='seed'?`<span class="age">${Math.max(0,2-(game.turn-u.born))}t</span>`:''}`;b.onclick=()=>play(i);$('board').append(b);}
 $('units').innerHTML='';for(const t of TYPES){const b=document.createElement('button');b.className='unit'+(t===selected?' active':'');b.setAttribute('aria-pressed',t===selected);b.innerHTML=`<span class="glyph">${icon(t)}</span>${t[0].toUpperCase()+t.slice(1)}`;b.onclick=()=>{selected=t;render();tone(280,.04);};$('units').append(b);}
 $('unitInfo').textContent={blade:'Blade · captures enemy units directly above, below, left and right on placement.',wall:'Wall · cannot be captured or moved. Secure one cell and block a future Echo.',seed:'Seed · blooms into a Blade at the start of turn +2. Protect it until then.',mirror:'Mirror · flips the nearest movable enemy to an empty reflected cell. Ties: lowest cell index.'}[selected];
 $('plan').innerHTML=game.echo.map((m,t)=>`<div class="step ${t<game.turn?'past':t===game.turn?'current':''}" title="Turn ${t+1}: ${m.t} at ${coord(m.p)}"><span>${t+1}</span><b>${icon(m.t)}</b>${coord(m.p)}</div>`).join('');
 const streak=profile.streaks[game.mode]||0;$('streak').textContent=streak;$('best').textContent=profile.best;$('multi').textContent='×'+multiplier(streak);$('xpBar').style.width=profile.xp%100+'%';$('xpText').textContent=`LEVEL ${1+Math.floor(profile.xp/100)} · ${profile.xp%100} / 100 XP`;$('mode').value=game.mode;$('sound').textContent=profile.sound?'♪ On':'♪ Off';
 $('modeNote').textContent={classic:'CLASSIC / Your eight placements become the next Echo, reflected left ↔ right.',apex:'APEX / Your highest-cell winning run becomes the Echo. Ties keep the earlier champion.',daily:`DAILY / ${game.day} UTC · identical challenge worldwide · best margin: ${profile.daily[game.day]??'—'}`,friend:'FRIEND / A fixed imported plan. Replay it to find a better counter.'}[game.mode];
 $('hint').innerHTML=game.over?'Round finished. <strong>Ready to face your past?</strong>':!profile.tutorial&&game.mode==='classic'&&game.round===1?['<strong>Tap any empty cell.</strong> Your Blade captures touching purple units.','<strong>Try Wall.</strong> A numbered ghost marks a future Echo placement. Block it.','<strong>Think two turns ahead.</strong> Try a Seed, or flip an enemy with Mirror.'][Math.min(game.turn,2)]:`<strong>${selected[0].toUpperCase()+selected.slice(1)} selected.</strong> Tap an empty cell. Ghost numbers show future turns.`;
 if(game.over){$('hint').innerHTML+='<button class="primary" id="againInline" style="margin-top:10px">One more round →</button>';$('againInline').onclick=nextRound;}
 applyTheme();}
// 3. ECHO REPLAY — plans are immutable; no adaptive hidden enemy choices.
const preset=[{p:12,t:'seed'},{p:6,t:'blade'},{p:18,t:'seed'},{p:8,t:'wall'},{p:16,t:'blade'},{p:2,t:'mirror'},{p:22,t:'blade'},{p:10,t:'blade'}];
function reflected(plan){return plan.map(m=>({p:mirror(m.p),t:m.t}));}
function dailyPlan(day){let n=2166136261;for(const c of day)n=Math.imul(n^c.charCodeAt(0),16777619)>>>0;const rand=()=>{n=(Math.imul(1664525,n)+1013904223)>>>0;return n/4294967296;};const cells=Array.from({length:25},(_,i)=>i);for(let i=24;i>0;i--){let j=Math.floor(rand()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]];}return cells.slice(0,8).map((p,i)=>({p,t:i<2?'seed':TYPES[Math.floor(rand()*4)]}));}
function start(mode='classic',echo=null,round=1){game={mode,echo:clone(echo||preset),board:Array(25).fill(null),turn:0,moves:[],round,over:false,day:new Date().toISOString().slice(0,10)};if(mode==='daily')game.echo=dailyPlan(game.day);beginTurn();}
function beginTurn(previous=[]){const changes=[...previous,...Rules.mature(game.board,game.turn)];const move=game.echo[game.turn],result=Rules.place(game.board,move,1,game.turn);$('log').textContent=`Echo ${game.turn+1}: ${move.t} at ${coord(move.p)}${result.blocked?' — blocked.':' established.'}`;render([...changes,...result.events,move.p]);save();}
function play(p){if(game.over||game.board[p])return;const m={p,t:selected};game.moves.push(m);const result=Rules.place(game.board,m,0,game.turn);juice([p,...result.events],result.events.length);if(game.turn===7){finish();return;}game.turn++;beginTurn([p,...result.events]);}
function nextRound(){closeModal();const mode=game.mode;let plan=game.echo;if(mode==='classic')plan=reflected(game.moves);if(mode==='apex')plan=profile.champion?reflected(profile.champion):preset;start(mode,plan,game.round+1);}
// Compact share format: 8 two-digit base36 moves + version + checksum.
function encode(plan){const body=plan.map(m=>(TYPES.indexOf(m.t)*25+m.p).toString(36).padStart(2,'0')).join('');let h=0;for(const c of body)h=(h*31+c.charCodeAt(0))%1296;return 'E1-'+body+'-'+h.toString(36).padStart(2,'0');}
function decode(code){const s=code.trim().toLowerCase();if(!/^e1-[0-9a-z]{16}-[0-9a-z]{2}$/.test(s))throw Error('Use a complete E1-… Echo code.');const body=s.slice(3,19),plan=[];for(let i=0;i<16;i+=2){const n=parseInt(body.slice(i,i+2),36);if(n>99)throw Error('Invalid move in code.');plan.push({p:n%25,t:TYPES[Math.floor(n/25)]});}if(encode(plan).toLowerCase()!==s)throw Error('Code checksum failed. Please copy it again.');return plan;}
// 4. UI & PROGRESSION — rewards affect cosmetics only, never game rules.
function multiplier(s){return Math.min(3,1+Math.floor(s/3)*.25);}
function finish(){game.over=true;profile.tutorial=true;const [you,echo]=Rules.score(game.board),margin=you-echo,win=margin>0;profile.streaks[game.mode]=win?(profile.streaks[game.mode]||0)+1:0;const streak=profile.streaks[game.mode],oldBest=profile.best;profile.best=Math.max(profile.best,streak);profile.rounds++;profile.last=clone(game.moves);if(win&&you>profile.championScore){profile.championScore=you;profile.champion=clone(game.moves);}let bonus=Math.random()<.18?15:0;const xp=Math.round((win?25:10)*multiplier(streak))+bonus;profile.xp+=xp;if(game.mode==='daily')profile.daily[game.day]=Math.max(profile.daily[game.day]??-25,margin);game.result={you,echo,margin,win,xp,bonus,unlocks:[2,4,7].filter(n=>oldBest<n&&profile.best>=n)};save();render();resultModal();tone(win?660:180,.22);}
function show(html){$('modalContent').innerHTML=html;if(!$('modal').open)$('modal').showModal();}
function closeModal(){$('modal').close();}
function resultModal(){const r=game.result;if(!r)return;show(`<div class="eyebrow">${r.win?'Past self defeated':'A new counter awaits'}</div><h2>${r.win?'You broke the loop.':r.margin===0?'A perfect tie.':`Lost by ${-r.margin} cell${r.margin===-1?'':'s'}.`}</h2><p><span style="color:var(--you)">${r.you} YOU</span> / <span style="color:var(--echo)">${r.echo} ECHO</span><br>${r.win?'Your streak continues.':r.margin===0?'Ties end the streak. One cell changes everything.':'The whole plan was visible. What would you change?'}</p><p>+${r.xp} XP ${r.bonus?'· Surprise +15 XP included ✦':''}${r.unlocks.length?'<br>New cosmetics unlocked!':''}</p><button class="primary" id="again">One more round →</button><div class="row"><button id="resultShare">Share my Echo</button><button id="review">Review board</button></div>`);$('again').onclick=nextRound;$('resultShare').onclick=share;$('review').onclick=closeModal;}
function share(){const plan=game.over?game.moves:profile.last;if(!plan){show('<h2>Finish a round first.</h2><p>Your eight moves become a short code your friends can fight offline.</p>');return;}show('<div class="eyebrow">Challenge a friend</div><h2>Send your past self.</h2><p>Copy this code. Your friend can choose “Fight a code” to face your reflected moves.</p><textarea id="shareCode" rows="2" readonly aria-label="Echo share code"></textarea><button class="primary" id="copyCode" style="margin-top:12px">Copy code</button><p id="copyStatus" class="tiny"></p>');$('shareCode').value=encode(plan);$('copyCode').onclick=async()=>{try{await navigator.clipboard.writeText($('shareCode').value);$('copyStatus').textContent='Copied. Send it to a friend.';}catch(e){$('shareCode').select();$('copyStatus').textContent='Select and copy the highlighted code.';}};}
function importDialog(){show('<div class="eyebrow">Perfect information. New opponent.</div><h2>Fight an Echo.</h2><textarea id="codeInput" rows="2" maxlength="80" placeholder="E1-…" aria-label="Paste Echo code"></textarea><p class="tiny">Starting this challenge replaces your current round and resets its streak.</p><button class="primary" id="loadCode">Start challenge →</button><p id="codeError" role="alert"></p>');$('loadCode').onclick=()=>{try{const p=decode($('codeInput').value);if(!game.over)profile.streaks[game.mode]=0;profile.streaks.friend=0;closeModal();start('friend',reflected(p));}catch(e){$('codeError').textContent=e.message;}};}
function help(){show('<div class="eyebrow">8 turns. 25 cells. One past self.</div><h2>Outplay yourself.</h2><p>1. Echo places first. Choose a unit, then tap an empty cell.<br>2. Blades capture orthogonal neighbours once. Walls resist captures and flips.<br>3. Seeds bloom at the start of turn +2 and capture once. Late Seeds still count as cells.<br>4. Mirrors flip the nearest eligible enemy left ↔ right into an empty cell, without changing its owner.</p><p>Ghost numbers and the timeline reveal the full Echo plan. Occupied Echo placements fizzle. Captured units keep their type and Seed timer. Seeds mature together before Echo acts.</p><p>After eight turns, most cells wins. A tie ends the streak. Classic replays your last round; Apex keeps your best winning plan. Daily uses the UTC date, independent of your progress.</p><button class="primary" id="gotIt">Let’s play →</button>');$('gotIt').onclick=closeModal;}
function cosmetics(){show(`<div class="eyebrow">Earned through win streaks</div><h2>Make your mark.</h2><p>Best streak: ${profile.best}</p><div class="row"><button id="neon">Neon</button><button id="amber" ${profile.best<2?'disabled':''}>Amber · 2 wins</button><button id="ice" ${profile.best<7?'disabled':''}>Ice · 7 wins</button></div><div class="row"><button id="baseSkin">Classic glyphs</button><button id="altSkin" ${profile.best<4?'disabled':''}>Prism · 4 wins</button></div>`);for(const theme of ['neon','amber','ice'])$(theme).onclick=()=>{profile.theme=theme;save();render();};$('baseSkin').onclick=()=>{profile.skin=0;save();render();};$('altSkin').onclick=()=>{profile.skin=1;save();render();};}
function applyTheme(){const c={neon:['#6bfbd1','#c092ff','#6bfbd122'],amber:['#ffc66b','#f78eab','#ffc66b22'],ice:['#7dddff','#ffab91','#7dddff22']}[profile.theme]||['#6bfbd1','#c092ff','#6bfbd122'];['--you','--echo','--glow'].forEach((v,i)=>document.documentElement.style.setProperty(v,c[i]));}
function confirmRestart(mode){show('<h2>Start a fresh round?</h2><p>This clears the current board. Leaving an unfinished round resets its streak.</p><button class="primary" id="confirmRestart">Start fresh →</button>');$('confirmRestart').onclick=()=>{if(!game.over)profile.streaks[game.mode]=0;const p=mode==='apex'&&profile.champion?reflected(profile.champion):mode===game.mode?game.echo:preset;closeModal();start(mode,p);};}
// 5. JUICE & SOUND — optional synthesized effects; reduced-motion respected.
function tone(freq,duration){if(!profile.sound)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.6,audioCtx.currentTime+duration);g.gain.setValueAtTime(.07,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration);}catch(e){}}
function juice(cells,captures){tone(captures?520:350,.12);if(navigator.vibrate)navigator.vibrate(captures?25:8);if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;if(captures){$('board').classList.remove('shake');void $('board').offsetWidth;$('board').classList.add('shake');}for(const i of cells){const r=$('board').children[i].getBoundingClientRect();for(let j=0;j<6;j++){const p=document.createElement('i');p.className='spark';p.style.left=r.x+r.width/2+'px';p.style.top=r.y+r.height/2+'px';p.style.setProperty('--dx',(Math.random()-.5)*90+'px');p.style.setProperty('--dy',(Math.random()-.5)*90+'px');document.body.append(p);setTimeout(()=>p.remove(),600);}}}
$('close').onclick=closeModal;$('help').onclick=help;$('share').onclick=share;$('import').onclick=importDialog;$('style').onclick=cosmetics;$('restart').onclick=()=>confirmRestart(game.mode);$('mode').onchange=e=>{const m=e.target.value;e.target.value=game.mode;confirmRestart(m);};$('sound').onclick=()=>{profile.sound=!profile.sound;save();render();tone(440,.1);};
if(game&&Array.isArray(game.board)&&game.board.length===25&&game.echo?.length===8){render();if(game.over)resultModal();}else start();
// Exposed pure functions allow deterministic automated regression testing.
window.EchoTest={Rules,mirror,reflected,dailyPlan,encode,decode,getState:()=>clone(game)};
